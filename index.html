<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel='favicon' href="data:,">
    <title>Google Login Test</title>
</head>
<body>

    <h1>My Web App Tool</h1>
    <p>Testing Google Sign-In below:</p>

    <!-- The actual login button container -->
    <div id="g_id_onload"
         data-client_id="349557569388-31niv4qavnfg5jrssef20n9ot0bio8fd.apps.googleusercontent.com"
         data-context="signin"
         data-ux_mode="popup"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false">
    </div>

    <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="outline" data-text="signin_with" data-size="large" data-logo_alignment="left"></div>

    <!-- The JavaScript handler function -->
    <script>
        function handleCredentialResponse(response) {
            console.log("SUCCESS! Secure JWT Token received from Google.");
            console.log("Token:", response.credential);
            alert("Logged in successfully! Check F12 Console for your token.");
        }
    </script>

    <!-- Google script placed at the absolute bottom to ensure elements exist first -->
    <script src="https://accounts.google.com" async defer></script>
</body>
</html>
